name: On Demand Pr Comment Workflows

on:
  issue_comment:
    types: [created]

permissions:
  # Needed for gcloud auth: https://github.com/google-github-actions/auth
  id-token: 'write'
  contents: 'read'
  # Needed for commenting on PRs
  pull-requests: 'write'
  issues: 'write'

jobs:
  help:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/help') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ".python-version"

    - name: Install PyYAML
      run: pip install PyYAML

    - name: Generate help text
      id: parse_commands
      run: python .github/scripts/get_help_text.py

    - name: Post help comment
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ github.event.issue.number }}
        message: ${{ steps.parse_commands.outputs.help_message }}

  # Reads SUPPORTED_PYTHON_VERSIONS and the comment to pick the unit-test and e2e legs. GitHub rejects
  # `matrix` in a job-level `if`, so the matrix jobs read their legs from this job's outputs. The scripts
  # run from the default branch; the PR supplies only `gigl/dep_vars.env` and `.python-version`, read as
  # data. `contains( github.event.comment.body, ...)` has a space after `(` because `/help` lists the
  # first `contains(github.event.comment.body, '<command>')` of every job `if`, and this job is not a command.
  plan:
    name: Plan the Python and E2E test matrices
    if: ${{ github.event.issue.pull_request && (contains( github.event.comment.body, '/unit_test_py') || endsWith(github.event.comment.body, '/unit_test') || contains( github.event.comment.body, '/all_test') || contains( github.event.comment.body, '/e2e_test')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Only for the failure comment below.
      pull-requests: write
    outputs:
      minors: ${{ steps.versions.outputs.minors }}
      matrix: ${{ steps.e2e.outputs.matrix }}
    steps:
    - name: Checkout default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Fetch the PR's version files
      env:
        PR_NUMBER: ${{ github.event.issue.number }}
      run: |
        git fetch --depth=1 origin "pull/${PR_NUMBER}/head"
        mkdir -p "${RUNNER_TEMP}/pr/gigl"
        git show FETCH_HEAD:gigl/dep_vars.env > "${RUNNER_TEMP}/pr/gigl/dep_vars.env"
        git show FETCH_HEAD:.python-version > "${RUNNER_TEMP}/pr/.python-version"

    - name: Read SUPPORTED_PYTHON_VERSIONS
      id: versions
      run: python3 .github/scripts/supported_python_versions.py --repo-root "${RUNNER_TEMP}/pr" >> "${GITHUB_OUTPUT}"

    - name: Plan E2E matrix
      id: e2e
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: python3 .github/scripts/e2e_matrix.py --repo-root "${RUNNER_TEMP}/pr" >> "${GITHUB_OUTPUT}"

    - name: Comment that the plan failed
      if: ${{ failure() }}
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ github.event.issue.number }}
        message: "Could not read `SUPPORTED_PYTHON_VERSIONS` or `.python-version` from this PR, so no tests started. Merge `main` into this PR and comment again. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  unit-test-python:
    needs: plan
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_py') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-24.04
    # TODO(kmonte): Reduce this :(
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.minors) }}
    steps:
    - name: Run Python Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Python ${{ matrix.python }} Unit Test"
        setup_gcloud: "true"
        # We use cloud run here instead of using github hosted runners because of limitation of tests
        # using GFile library (a.k.a anything that does IO w/ Tensorflow). GFile does not understand
        # how to leverage Workload Identity Federation to read assets from GCS, et al. See:
        # https://github.com/tensorflow/tensorflow/issues/57104
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        python_version: ${{ matrix.python }}
        command: |
          make unit_test_py

  unit-test-cpp:
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_cpp') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Run C++ Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "C++ Unit Test"
        use_cloud_run: "false"
        command: |
          bash gigl-core/requirements/install_cpp_deps.sh
          bash requirements/install_py_deps.sh --skip-glt-post-install
          export PATH="$HOME/.local/bin:$PATH"
          make unit_test_cpp

  unit-test-scala:
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_scala') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Run Scala Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Scala Unit Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make unit_test_scala

  integration-test:
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/integration_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-24.04
    # TODO(kmonte): Reduce this :(
    timeout-minutes: 120
    steps:
    - name: Run Integration Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Integration Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
            # Immutable per-run image tag so concurrent runs can't overwrite each other's tag.
            make integration_test INTEGRATION_TEST_CPU_IMAGE_TAG=${{ github.run_id }}.${{ github.run_attempt }}

  # `/e2e_test all` (exactly one space) runs every supported Python minor; `/e2e_test` and
  # `/all_test` run only the default one. The non-default minors run the in-memory (GLT)
  # pipelines only.
  integration-e2e-test:
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/e2e_test') || contains(github.event.comment.body, '/all_test')) }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 155 # Tests as of 2025-05-16 are taking ~110 mins to complete, 40% buffer
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Run E2E Tests (`/e2e_test all` adds the GLT pipelines on every other Python minor)
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Python ${{ matrix.python }} E2E Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        python_version: ${{ matrix.python }}
        command: |
          make ${{ matrix.target }}

  notebooks-e2e-test:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/notebook_tests') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 155 # Tests as of 2025-05-16 are taking ~110 mins to complete, 40% buffer
    steps:
    - name: Run Example Notebooks Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Example Notebooks Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make notebooks_test


  lint-test:
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/lint_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # If our linting takes longer than 20 minutes something has gone very wrong...
    steps:
    - name: Run Linting Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      # Route sbt through Google's Maven Central mirror to avoid 429 rate limits from repo1.maven.org.
      # Intentionally set here (CI env) rather than in scala/.sbtopts or scala_spark35/.sbtopts to avoid
      # affecting downstream consumers of GiGL (e.g. as a submodule) that have their own Maven routing.
      env:
        SBT_OPTS: '-Dsbt.override.build.repos=true -Dsbt.repository.config=repositories'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Lint Test"
        install_dev_deps: "true"
        setup_gcloud: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          # sourcing .profile is important to resolve paths for java, sbt, et al.
          # It is setup in the setup-python-tools action.
          source ~/.profile
          make lint_test
