name: On Demand Pr Comment Workflows

on:
  issue_comment:
    types: [created]

# Least privilege by default. `issue_comment` runs in the base-repo context with access to
# secrets, so the default token is capped to read here and each job elevates only what it
# needs. This limits the blast radius if untrusted PR code executes.
permissions:
  contents: read

jobs:
  help:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/help') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `help` checks out the base default branch (trusted) and runs no PR code, so it needs no
    # collaborator gate or environment approval -- only the ability to comment on the PR
    # (which needs both issues:write and pull-requests:write for the issue-comments API).
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version-file: ".python-version"

    - name: Install PyYAML
      run: pip install PyYAML

    - name: Generate help text
      id: parse_commands
      run: python .github/scripts/get_help_text.py

    - name: Post help comment
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ github.event.issue.number }}
        message: ${{ steps.parse_commands.outputs.help_message }}

  # Prepare freezes the PR head SHA ONCE for the whole run so every command job pins to the
  # same authorized commit (a `/all_test` fan-out cannot resolve different tips per job). The
  # frozen SHA is posted for the approving reviewer; the environment gate on the command jobs
  # binds their execution to it.
  prepare:
    if: >-
      github.event.issue.pull_request && (
        contains(github.event.comment.body, '/unit_test') ||
        contains(github.event.comment.body, '/all_test') ||
        contains(github.event.comment.body, '/integration_test') ||
        contains(github.event.comment.body, '/e2e_test') ||
        contains(github.event.comment.body, '/notebook_tests') ||
        contains(github.event.comment.body, '/lint_test')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Required to inspect the environment's protection rules.
      contents: read
      pull-requests: write
      issues: write
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      is_cross_repository: ${{ steps.resolve.outputs.is_cross_repository }}
    steps:
    # Gate the commenter here too (not only inside run-command-on-pr) so a non-collaborator
    # cannot trigger the SHA-freeze comment or a pending environment-approval notification.
    - name: Verify commenter is a collaborator
      uses: snapchat/gigl/.github/actions/assert-is-collaborator@main
      with:
        username: ${{ github.event.comment.user.login }}
        initiating-pr-number: ${{ github.event.issue.number }}
    - name: Resolve and freeze PR head SHA
      id: resolve
      uses: snapchat/gigl/.github/actions/get-pr-src-branch@main
      with:
        pr_number: ${{ github.event.issue.number }}
    # For fork PRs, refuse to proceed unless the approval environment is actually protected.
    # GitHub auto-creates a referenced environment with NO protection rules, so without this
    # check a missing/misconfigured `pr-command-execution` would let fork commands run with no
    # approval (fail open). This makes the gate mechanically verified rather than setup-dependent.
    - name: Verify approval environment is protected (fork PRs only)
      if: ${{ steps.resolve.outputs.is_cross_repository == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const environment_name = "pr-command-execution";
          let data;
          try {
            ({ data } = await github.rest.repos.getEnvironment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment_name,
            }));
          } catch (error) {
            throw new Error(
              `Cannot verify the '${environment_name}' environment (${error.status || "error"}: ${error.message}). ` +
              `Refusing to run fork-PR commands.`
            );
          }
          const rules = data.protection_rules || [];
          const hasRequiredReviewers = rules.some(
            (rule) => rule.type === "required_reviewers" && (rule.reviewers || []).length > 0
          );
          if (!hasRequiredReviewers) {
            throw new Error(
              `The '${environment_name}' environment has no required-reviewers protection rule. ` +
              `Refusing to run fork-PR commands (the approval gate would fail open). ` +
              `Configure required reviewers under Settings -> Environments.`
            );
          }
          console.log(`Verified '${environment_name}' has a required-reviewers protection rule.`);
    - name: Post frozen SHA
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ github.event.issue.number }}
        message: |
          🔒 Command received. This run is pinned to commit `${{ steps.resolve.outputs.head_sha }}`
          ([view commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.resolve.outputs.head_sha }})).
          Any push after this point will NOT change what runs: the job aborts if the PR branch has moved off this SHA.
          ${{ steps.resolve.outputs.is_cross_repository == 'true' && 'This PR is from a fork, so a reviewer must approve the `pr-command-execution` environment before the command runs — approve only if this is the commit you intend to execute.' || 'Same-repo PR: the command runs without extra approval.' }}

  unit-test-python:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_py') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    # TODO(kmonte): Reduce this :(
    timeout-minutes: 120
    steps:
    - name: Run Python Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Python Unit Test"
        setup_gcloud: "true"
        # We use cloud run here instead of using github hosted runners because of limitation of tests
        # using GFile library (a.k.a anything that does IO w/ Tensorflow). GFile does not understand
        # how to leverage Workload Identity Federation to read assets from GCS, et al. See:
        # https://github.com/tensorflow/tensorflow/issues/57104
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make unit_test_py

  unit-test-cpp:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_cpp') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    # No GCP access needed for this job, so no id-token.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 20
    steps:
    - name: Run C++ Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "C++ Unit Test"
        use_cloud_run: "false"
        command: |
          bash gigl-core/requirements/install_cpp_deps.sh
          bash requirements/install_py_deps.sh --skip-glt-post-install
          export PATH="$HOME/.local/bin:$PATH"
          make unit_test_cpp

  unit-test-scala:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/unit_test_scala') || endsWith(github.event.comment.body, '/unit_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 20
    steps:
    - name: Run Scala Unit Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Scala Unit Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make unit_test_scala

  integration-test:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/integration_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    # TODO(kmonte): Reduce this :(
    timeout-minutes: 120
    steps:
    - name: Run Integration Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Integration Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
            # Immutable per-run image tag so concurrent runs can't overwrite each other's tag.
            make integration_test INTEGRATION_TEST_CPU_IMAGE_TAG=${{ github.run_id }}.${{ github.run_attempt }}

  integration-e2e-test:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/e2e_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 155 # Tests as of 2025-05-16 are taking ~110 mins to complete, 40% buffer
    steps:
    - name: Run E2E Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "E2E Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make run_all_e2e_tests

  notebooks-e2e-test:
    needs: prepare
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/notebook_tests') }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 155 # Tests as of 2025-05-16 are taking ~110 mins to complete, 40% buffer
    steps:
    - name: Run Example Notebooks Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Example Notebooks Test"
        setup_gcloud: "true"
        use_cloud_run: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          make notebooks_test


  lint-test:
    needs: prepare
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/lint_test') || contains(github.event.comment.body, '/all_test')) }}
    runs-on: ubuntu-latest
    # Only fork PRs (untrusted author controls the branch) require human approval. Same-repo
    # PRs can only be pushed by collaborators, so `/all_test` etc. run without an approval gate.
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 20 # If our linting takes longer than 20 minutes something has gone very wrong...
    steps:
    - name: Run Linting Tests
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      # Route sbt through Google's Maven Central mirror to avoid 429 rate limits from repo1.maven.org.
      # Intentionally set here (CI env) rather than in scala/.sbtopts or scala_spark35/.sbtopts to avoid
      # affecting downstream consumers of GiGL (e.g. as a submodule) that have their own Maven routing.
      env:
        SBT_OPTS: '-Dsbt.override.build.repos=true -Dsbt.repository.config=repositories'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Lint Test"
        install_dev_deps: "true"
        setup_gcloud: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        command: |
          # sourcing .profile is important to resolve paths for java, sbt, et al.
          # It is setup in the setup-python-tools action.
          source ~/.profile
          make lint_test
