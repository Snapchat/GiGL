name: CI Tests

on:
  # Run whenever GitHub’s merge queue asks for required checks
  # We add `pull_request` below to get around a merge queue status check limitation:
  # https://github.com/orgs/community/discussions/46757#discussioncomment-4912738
  pull_request:
  merge_group:

permissions:
  # Needed for gcloud auth: https://github.com/google-github-actions/auth
  id-token: 'write'
  contents: 'read'
  # Needed for commenting on PRs
  pull-requests: 'write'
  issues: 'write'

jobs:
  # A matrix job reports one check per leg in the merge queue but a single check under its
  # job id when skipped on pull_request, so no matrix job can be a required check. Each
  # matrix job has a gate job whose id is the required check instead: skipped on
  # pull_request, and in the merge queue it passes only if every leg passed.
  ci-unit-test-python:
    needs: [ci-unit-test-python-matrix]
    # always() runs this even when a leg failed, so it reports a failure instead of skipping.
    if: ${{ always() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - name: Check that every leg passed
      env:
        MATRIX_RESULT: ${{ needs.ci-unit-test-python-matrix.result }}
      run: |
        echo "ci-unit-test-python-matrix: ${MATRIX_RESULT}"
        [[ "${MATRIX_RESULT}" == "success" ]]

  ci-unit-test-python-matrix:
    # Because of limitation discussed https://github.com/orgs/community/discussions/46757#discussioncomment-4912738
    # We skip when the workflow is triggered by a pull_request event; otherwise we will run the check twice.
    # Once before it gets into the merge queue and once when it is in the merge queue.
    # Our tests take a long time to run, so this is not ideal.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup development environment
      uses: ./.github/actions/setup-python-tools
      with:
          setup_gcloud: "true"
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          gcp_service_account_email: ${{ secrets.gcp_service_account_email }}
    - name: Run Python Unit Tests
      # We use cloud run here instead of using github hosted runners because of limitation of tests
      # using GFile library (a.k.a anything that does IO w/ Tensorflow). GFile does not understand
      # how to leverage Workload Identity Federation to read assets from GCS, et al. See:
      # https://github.com/tensorflow/tensorflow/issues/57104
      uses: ./.github/actions/run-cloud-run-command-on-active-checkout
      with:
        cmd: "make unit_test_py"
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}
        python_version: ${{ matrix.python }}

  ci-unit-test-scala:
    # Because of limitation discussed https://github.com/orgs/community/discussions/46757#discussioncomment-4912738
    # We skip when the workflow is triggered by a pull_request event; otherwise we will run the check twice.
    # Once before it gets into the merge queue and once when it is in the merge queue.
    # Our tests take a long time to run, so this is not ideal.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup development environment
      uses: ./.github/actions/setup-python-tools
      with:
          setup_gcloud: "true"
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          gcp_service_account_email: ${{ secrets.gcp_service_account_email }}
    - name: Run Scala Unit Tests
      # We use cloud run here instead of using github hosted runners because of limitation of tests
      # using GFile library (a.k.a anything that does IO w/ Tensorflow). GFile does not understand
      # how to leverage Workload Identity Federation to read assets from GCS, et al. See:
      # https://github.com/tensorflow/tensorflow/issues/57104
      uses: ./.github/actions/run-cloud-run-command-on-active-checkout
      with:
        cmd: "make unit_test_scala"
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}

  ci-unit-test-cpp:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install C++ dependencies
      run: bash gigl-core/requirements/install_cpp_deps.sh
    - name: Set up Python tools
      uses: ./.github/actions/setup-python-tools
    - name: Install Python dependencies
      run: bash requirements/install_py_deps.sh --skip-glt-post-install
    - name: Run C++ Unit Tests
      run: make unit_test_cpp

  ci-integration-test:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup development environment
      uses: ./.github/actions/setup-python-tools
      with:
          setup_gcloud: "true"
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          gcp_service_account_email: ${{ secrets.gcp_service_account_email }}
    - name: Run Integration Tests
      uses: ./.github/actions/run-cloud-run-command-on-active-checkout
      with:
        # Immutable per-run image tag so concurrent runs can't overwrite each other's tag.
        cmd: "make integration_test INTEGRATION_TEST_CPU_IMAGE_TAG=${{ github.run_id }}.${{ github.run_attempt }}"
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}

  ci-integration-e2e-test:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup development environment
      uses: ./.github/actions/setup-python-tools
      with:
          setup_gcloud: "true"
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          gcp_service_account_email: ${{ secrets.gcp_service_account_email }}
    - name: Run E2E Tests
      uses: ./.github/actions/run-cloud-run-command-on-active-checkout
      with:
        cmd: "make run_all_e2e_tests"
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}

  # The non-default Python minors run only the GLT e2e pipelines, in parallel with ci-integration-e2e-test.
  ci-integration-e2e-test-nondefault-python:
    needs: [ci-integration-e2e-test-nondefault-python-matrix]
    # always() runs this even when a leg failed, so it reports a failure instead of skipping.
    if: ${{ always() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - name: Check that every leg passed
      env:
        MATRIX_RESULT: ${{ needs.ci-integration-e2e-test-nondefault-python-matrix.result }}
      run: |
        echo "ci-integration-e2e-test-nondefault-python-matrix: ${MATRIX_RESULT}"
        [[ "${MATRIX_RESULT}" == "success" ]]

  ci-integration-e2e-test-nondefault-python-matrix:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup development environment
      uses: ./.github/actions/setup-python-tools
      with:
          setup_gcloud: "true"
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          gcp_service_account_email: ${{ secrets.gcp_service_account_email }}
    - name: Run GLT E2E Tests
      uses: ./.github/actions/run-cloud-run-command-on-active-checkout
      with:
        cmd: "make run_glt_e2e_tests"
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}
        python_version: ${{ matrix.python }}

