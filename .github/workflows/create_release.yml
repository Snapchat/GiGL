name: Create Release

# This workflow can be triggered in two ways:
# 1. Workflow dispatch: Manually dispatch the workflow and choose bump type and project
# 2. Workflow call: Execute this workflow from another workflow with bump type as an input

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'nightly'
        type: choice
        options:
          - major
          - minor
          - patch
          - nightly

  workflow_call:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        type: string # workflow_call doesnt support choice inputs
    outputs:
      release_branch_name:
        description: "Generated release branch name"
        value: ${{ jobs.bump_version.outputs.release_branch_name }}


jobs:
  # First job: Bump version and create release branch
  bump_version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      current_version: ${{ steps.get_version.outputs.current_version }}
      new_version: ${{ steps.get_new_version.outputs.new_version }}
      release_branch_name: ${{ steps.get_new_version.outputs.release_branch_name }}
      bump_type: ${{ steps.set_vars.outputs.bump_type }}
      minors: ${{ steps.versions.outputs.minors }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Machine for bumping version
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        install_dev_deps: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    # Capture current version before bumping
    - name: Get current version
      id: get_version
      run: |
        CURRENT_VERSION=$(uv run python -m scripts.bump_version --get_current_version)
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"

    # Determine bump type based on trigger method
    - name: Set workflow variables
      id: set_vars
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
      run: |
        if [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
          echo "bump_type=${INPUT_BUMP_TYPE}" >> $GITHUB_OUTPUT
        else
          echo "bump_type=nightly" >> $GITHUB_OUTPUT
        fi

    # Perform the version bump
    - name: Bump version
      env:
        BUMP_TYPE: ${{ steps.set_vars.outputs.bump_type }}
        PROJECT: ${{ vars.GCP_PROJECT_ID }}
      run: |
        uv run python -m scripts.bump_version \
          --bump_type "${BUMP_TYPE}" \
          --project "${PROJECT}"

    # bump_version rewrites the gigl-core version in gigl-core/pyproject.toml, so gigl-core/uv.lock is re-locked here
    # and picked up by the commit step below. The root uv.lock needs no step: the `uv run` calls re-lock it. The
    # gigl-core lock holds only the gigl-core entry, so the version line is the only thing that can change.
    - name: Re-lock gigl-core after the version bump
      working-directory: gigl-core
      run: uv lock

    # Capture new version and create release branch name
    - name: Get new version
      id: get_new_version
      run: |
        NEW_VERSION=$(uv run python -m scripts.bump_version --get_current_version)
        RELEASE_BRANCH_NAME="release/v${NEW_VERSION}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "release_branch_name=$RELEASE_BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
        echo "Release branch name: $RELEASE_BRANCH_NAME"


    # Commit version changes to new release branch
    - name: Commit and push version bump
      uses: snapchat/gigl/.github/actions/commit-and-push@main
      with:
        commit_message: "[AUTOMATED] Bumped version to v${{ steps.get_new_version.outputs.new_version }}"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        to_new_branch_named: ${{ steps.get_new_version.outputs.release_branch_name }}

    # The release branch's dep_vars.env is the one the release legs run with.
    - name: Read SUPPORTED_PYTHON_VERSIONS
      id: versions
      run: python3 .github/scripts/supported_python_versions.py >> "${GITHUB_OUTPUT}"

  # One leg per Python minor, each run in that minor's builder image.
  release_gigl_kfp_pipeline:
    needs: bump_version
    runs-on: ubuntu-24.04
    strategy:
      # A failing minor must not cancel another minor's leg in the middle of its pushes.
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.bump_version.outputs.minors) }}
    # Runs in the release environment so GCP_SERVICE_ACCOUNT_EMAIL resolves to the release
    # service account, the only identity allowed to push release images to public-gigl.
    # The PR/test service account cannot. See RELEASING.md, "Release identity and permissions".
    environment:
      name: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout release branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.bump_version.outputs.release_branch_name }}

    - name: Setup Machine for release
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        install_dev_deps: "false"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Release GiGL KFP pipeline
      uses: snapchat/gigl/.github/actions/run-cloud-run-command-on-active-checkout@main
      with:
        python_version: ${{ matrix.python }}
        # The builder image's UV_PYTHON selects the minor; `python_version` picks that builder.
        cmd: make release_kfp_pipeline
        service_account:  ${{ secrets.gcp_service_account_email }}
        project:  ${{ vars.GCP_PROJECT_ID }}

  # TODO: (svij) Let's deprecate this as no one uses it beyond it being used for the TUT.
  # release_dev_workbench_image:
  #   needs: bump_version
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #     id-token: write

  #   steps:
  #   - name: Checkout release branch
  #     uses: actions/checkout@v4
  #     with:
  #       ref: ${{ needs.bump_version.outputs.release_branch_name }}

  #   - name: Setup Machine for workbench image release
  #     uses: ./.github/actions/setup-python-tools
  #     with:
  #       setup_gcloud: "true"
  #       install_dev_deps: "false"
  #       gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  #       workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
  #       gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    # - name: Release Dev Workbench Image
    #   uses: snapchat/gigl/.github/actions/run-cloud-run-command-on-active-checkout@main
    #   with:
    #     cmd: |
    #       bash ./requirements/install_scala_deps.sh --download-only
    #       make push_dev_workbench_docker_image
    #     service_account:  ${{ secrets.gcp_service_account_email }}
    #     project:  ${{ vars.GCP_PROJECT_ID }}


  # TODO: (svij) Also release the dev image

  # Final job: Create PR and tag after all releases complete
  create_release_pr:
    needs:
      - bump_version
      - release_gigl_kfp_pipeline
      # - release_dev_workbench_image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout release branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.bump_version.outputs.release_branch_name }}

    # Create and push version tag
    - name: Create version tag
      env:
        NEW_VERSION: ${{ needs.bump_version.outputs.new_version }}
      run: |
        git tag "v${NEW_VERSION}"
        git push origin "v${NEW_VERSION}"

    # Create PR to merge release branch back to main
    - name: Create a new PR
      if: ${{ inputs.bump_type != 'nightly' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ needs.bump_version.outputs.new_version }}
        CURRENT_VERSION: ${{ needs.bump_version.outputs.current_version }}
        BUMP_TYPE: ${{ needs.bump_version.outputs.bump_type }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        gh pr create --title "Release v${NEW_VERSION}" \
        --body "## Release v${NEW_VERSION}

        This updates and releases GiGL version from \`${CURRENT_VERSION}\` to \`${NEW_VERSION}\`.

        ### Info:
        - **Bump Type:** ${BUMP_TYPE}
        - **Trigger:** ${EVENT_NAME}
        - The version tag was created here: https://github.com/Snapchat/GiGL/releases/tag/v${NEW_VERSION}.
        ### What's Next:
        Please create a new release from the [tag](https://github.com/Snapchat/GiGL/releases/tag/v${NEW_VERSION}).
        ---
        *This PR was automatically created by the Create Release workflow.*" \
        --base main --head "release/v${NEW_VERSION}"


    # Display summary information about the release
    - name: Output release information
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
        RELEASE_BRANCH_NAME: ${{ needs.bump_version.outputs.release_branch_name }}
        BUMP_TYPE: ${{ needs.bump_version.outputs.bump_type }}
        NEW_VERSION: ${{ needs.bump_version.outputs.new_version }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "${INPUT_BUMP_TYPE}" != "nightly" ]; then
          PR_URL=$(gh pr view "${RELEASE_BRANCH_NAME}" --json url --jq '.url')
          echo "::notice title=Release PR URL::$PR_URL"
        fi
        echo "::notice title=Bump Type::${BUMP_TYPE}"
        echo "::notice title=New Version Tag::v${NEW_VERSION}"
        echo "::notice title=Trigger::${EVENT_NAME}"
