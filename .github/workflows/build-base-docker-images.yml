name: build-base-docker-images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR to run the workflow on'
        required: true

env:
  DOCKER_BUILDKIT: 1
  # Base images are build inputs, not releases, so they live in gigl-base-images, the only
  # Docker repository the PR/test service account can write to. Only the release workflows
  # may write to public-gigl. See RELEASING.md, "Release identity and permissions".
  GIGL_BASE_CUDA_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gigl-base-images/gigl-cuda-base:${{ github.sha }}.${{ github.run_number }}.${{ github.run_attempt }}
  GIGL_BASE_CPU_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gigl-base-images/gigl-cpu-base:${{ github.sha }}.${{ github.run_number }}.${{ github.run_attempt }}
  GIGL_BASE_DATAFLOW_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gigl-base-images/gigl-dataflow-base:${{ github.sha }}.${{ github.run_number }}.${{ github.run_attempt }}
  GIGL_BUILDER_IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gigl-base-images/gigl-builder:${{ github.sha }}.${{ github.run_number }}.${{ github.run_attempt }}
  # The GIGL_*_IMAGE values above are the tag that every image of one run shares. Each matrix leg
  # pushes <value>-<tag>, built on the Python version in its `python` entry. The legs come from
  # SUPPORTED_PYTHON_VERSIONS in gigl/dep_vars.env (see the python-versions job).
  WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  python-versions:
    name: Read the supported Python versions
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.versions.outputs.builds }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
    - name: Checkout PR Branch
      uses: snapchat/gigl/.github/actions/checkout-pr-branch@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
    - name: Read SUPPORTED_PYTHON_VERSIONS
      id: versions
      run: python3 .github/scripts/supported_python_versions.py >> "${GITHUB_OUTPUT}"

  comment-workflow-started:

    needs: python-versions
    runs-on: ubuntu-24.04
    steps:
    - name: Comment on PR
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ inputs.pr_number }}
        message: |
          Starting to [build](${{env.WORKFLOW_URL}}) the CUDA, CPU, Dataflow and builder images for every Python version in `SUPPORTED_PYTHON_VERSIONS`: ${{ needs.python-versions.outputs.versions }}.
          This may take a while, please be patient.
          The images will be pushed to the GCP Artifact Registry.
          Each image is pushed once per version, as `<ref>-py<major><minor>`.
          Once done, the workflow will update `gigl/dep_vars.env` and the Cloud Build default builder with the new refs.

  build-cuda-base-image:
    runs-on: gigl-large-instances # x64 Ubuntu:latest w/ 8-cores, 32GB RAM, 300 GB SSD
    needs: python-versions
    strategy:
      matrix:
        include: ${{ fromJSON(needs.python-versions.outputs.builds) }}
    permissions:
      # Needed for gcloud auth: https://github.com/google-github-actions/auth
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout PR Branch
      uses: snapchat/gigl/.github/actions/checkout-pr-branch@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
    - name: Setup Machine for building Docker images
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        try_cleaning_disk_space: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Build and Push CUDA Base Image
      env:
        PYTHON_VERSION: ${{ matrix.python }}
        IMAGE: ${{ env.GIGL_BASE_CUDA_IMAGE }}-${{ matrix.tag }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        docker build --build-arg PYTHON_VERSION="${PYTHON_VERSION}" -f ./containers/Dockerfile.cuda.base -t "${IMAGE}" .
        docker run --rm -v "${PWD}/scripts:/gigl_scripts:ro" --entrypoint python "${IMAGE}" \
          /gigl_scripts/smoke_test_image.py --image-type cuda --python "${PYTHON_VERSION%.*}"
        docker push "${IMAGE}"
        echo "Pushed CUDA base image to ${IMAGE}"

  build-cpu-base-image:
    runs-on: ubuntu-24.04
    needs: python-versions
    strategy:
      matrix:
        include: ${{ fromJSON(needs.python-versions.outputs.builds) }}
    permissions:
      # Needed for gcloud auth: https://github.com/google-github-actions/auth
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout PR Branch
      uses: snapchat/gigl/.github/actions/checkout-pr-branch@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
    - name: Setup Machine for building Docker images
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        try_cleaning_disk_space: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
    - name: Build and Push CPU Base Image and Docker CPU Image
      env:
        PYTHON_VERSION: ${{ matrix.python }}
        IMAGE: ${{ env.GIGL_BASE_CPU_IMAGE }}-${{ matrix.tag }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

        docker build --build-arg PYTHON_VERSION="${PYTHON_VERSION}" -f ./containers/Dockerfile.cpu.base -t "${IMAGE}" .
        docker run --rm -v "${PWD}/scripts:/gigl_scripts:ro" --entrypoint python "${IMAGE}" \
          /gigl_scripts/smoke_test_image.py --image-type cpu --python "${PYTHON_VERSION%.*}"
        docker push "${IMAGE}"
        echo "Pushed CPU base image to ${IMAGE}"

  build-dataflow-base-image:
    runs-on: ubuntu-24.04
    needs: python-versions
    strategy:
      matrix:
        include: ${{ fromJSON(needs.python-versions.outputs.builds) }}
    permissions:
      # Needed for gcloud auth: https://github.com/google-github-actions/auth
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout PR Branch
      uses: snapchat/gigl/.github/actions/checkout-pr-branch@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
    - name: Setup Machine for building Docker images
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        try_cleaning_disk_space: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
    - name: Build and Push Dataflow Base Image
      env:
        PYTHON_VERSION: ${{ matrix.python }}
        IMAGE: ${{ env.GIGL_BASE_DATAFLOW_IMAGE }}-${{ matrix.tag }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        docker build --build-arg PYTHON_VERSION="${PYTHON_VERSION}" -f ./containers/Dockerfile.dataflow.base -t "${IMAGE}" .
        docker run --rm -v "${PWD}/scripts:/gigl_scripts:ro" --entrypoint python "${IMAGE}" \
          /gigl_scripts/smoke_test_image.py --image-type dataflow --python "${PYTHON_VERSION%.*}"
        docker push "${IMAGE}"
        echo "Pushed Dataflow base image to ${IMAGE}"

  build-builder-image:
    runs-on: ubuntu-24.04
    needs: python-versions
    strategy:
      matrix:
        include: ${{ fromJSON(needs.python-versions.outputs.builds) }}
    permissions:
      # Needed for gcloud auth: https://github.com/google-github-actions/auth
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout PR Branch
      uses: snapchat/gigl/.github/actions/checkout-pr-branch@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
    - name: Setup Machine for building Docker images
      uses: ./.github/actions/setup-python-tools
      with:
        setup_gcloud: "true"
        try_cleaning_disk_space: "true"
        gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        gcp_service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Build and Push the builder image used by cloud build
      env:
        PYTHON_VERSION: ${{ matrix.python }}
        IMAGE: ${{ env.GIGL_BUILDER_IMAGE }}-${{ matrix.tag }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        # Download scala deps so they are avaialble for docker context to use
        # See: Dockerfile.builder
        bash ./requirements/install_scala_deps.sh --download-only
        docker build --build-arg PYTHON_VERSION="${PYTHON_VERSION}" -f ./containers/Dockerfile.builder -t "${IMAGE}" .
        docker run --rm -v "${PWD}/scripts:/gigl_scripts:ro" --entrypoint python "${IMAGE}" \
          /gigl_scripts/smoke_test_image.py --image-type builder --python "${PYTHON_VERSION%.*}"
        docker push "${IMAGE}"
        echo "Pushed Builder image to ${IMAGE}"

  build-and-commit-base-images:
    needs:
      - python-versions
      - build-cuda-base-image
      - build-cpu-base-image
      - build-dataflow-base-image
      - build-builder-image
    runs-on: ubuntu-24.04
    steps:
    - name: Commit and Push Base Images
      uses: snapchat/gigl/.github/actions/run-command-on-pr@main
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ inputs.pr_number }}
        should_leave_progress_comments: "false"
        command: bash .github/scripts/update_docker_image_refs.sh
    - name: Commit and Push Dep Vars
      uses: snapchat/gigl/.github/actions/commit-and-push@main
      with:
        commit_message: "[AUTOMATED] Update dep.vars, and other relevant files with new image names"
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ inputs.pr_number }}
        message: |
          Built and pushed new images for the Python versions ${{ needs.python-versions.outputs.versions }}, each as `<ref>-py<major><minor>`:
          * CUDA base image: `${{ env.GIGL_BASE_CUDA_IMAGE }}`
          * CPU base image: `${{ env.GIGL_BASE_CPU_IMAGE }}`
          * Dataflow base image: `${{ env.GIGL_BASE_DATAFLOW_IMAGE }}`
          * Builder image: `${{ env.GIGL_BUILDER_IMAGE }}`

          Updated `gigl/dep_vars.env` with every per-minor ref.
