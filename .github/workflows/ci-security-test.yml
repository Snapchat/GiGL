    if: ${{ github.event_name == 'issue_comment' && github.repository == 'Snapchat/GiGL' && github.event.issue.number == 780 && github.event.issue.pull_request && contains(github.event.comment.body, '/all_test') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    timeout-minutes: 10
    steps:
    - name: Run E2E smoke test
      uses: snapchat/gigl/.github/actions/run-command-on-pr@8323ae3a62e3437d360160ee8d5a15565cdc6684
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "E2E Smoke Test"
        command: |
          printf 'E2E smoke test at %s\n' "$(git rev-parse HEAD)"

  lint-test:
    needs: prepare
    if: ${{ github.event_name == 'issue_comment' && github.repository == 'Snapchat/GiGL' && github.event.issue.number == 780 && github.event.issue.pull_request && contains(github.event.comment.body, '/all_test') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.is_cross_repository == 'true' && 'pr-command-execution' || '' }}
    timeout-minutes: 10
    steps:
    - name: Run lint smoke test
      uses: snapchat/gigl/.github/actions/run-command-on-pr@8323ae3a62e3437d360160ee8d5a15565cdc6684
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr_number: ${{ github.event.issue.number }}
        sha: ${{ needs.prepare.outputs.head_sha }}
        should_leave_progress_comments: "true"
        descriptive_workflow_name: "Lint Smoke Test"
        command: |
          printf 'Lint smoke test at %s\n' "$(git rev-parse HEAD)"
