name: Check Collaborator
description: Fails if the specified user is not a collaborator on the repo
inputs:
  username:
    description: The GitHub username to check
    required: true
  initiating-pr-number:
    description: The PR number that the check may be associated with, if provided will comment on the PR incase of failures
    required: false
runs:
  using: "composite"
  steps:
    - name: Check if user is a collaborator
      id: assert-is-collaborator
      # For API Docs, See: https://octokit.github.io/rest.js/v21/
      # github --> maps to an octokit instance in the script.
      # No token input: actions/github-script authenticates via its default `github-token`,
      # which is ${{ github.token }} (the workflow's automatic GITHUB_TOKEN).
      uses: actions/github-script@v7
      env:
        USERNAME: ${{ inputs.username }}
      with:
        # https://docs.github.com/en/rest/collaborators/collaborators?apiVersion=2022-11-28#check-if-a-user-is-a-repository-collaborator
        script: |
          // Fail closed: authorization succeeds ONLY on an explicit 204 from
          // checkCollaborator. Every other outcome -- 404 (not a collaborator),
          // 403 (token/permission/rate-limit), any other status, or any thrown
          // error -- denies the run. A previous version logged 403/other errors
          // instead of throwing, which let a non-collaborator through.
          const username = process.env.USERNAME;
          let result;
          try {
            result = await github.rest.repos.checkCollaborator({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: username,
            });
          } catch (error) {
            const status = error.status || "unknown";
            throw new Error(
              `${username} is NOT authorized to run this workflow (collaborator check failed: ${status} ${error.message}).`
            );
          }
          if (result.status !== 204) {
            throw new Error(
              `${username} is NOT authorized to run this workflow (unexpected status ${result.status} from collaborator check).`
            );
          }
          console.log(`${username} is a collaborator.`);

    - name: Comment workflow permissions
      if: ${{ failure() && steps.assert-is-collaborator.conclusion == 'failure' && inputs.initiating-pr-number != '' }}
      uses: snapchat/gigl/.github/actions/comment-on-pr@b5f3ba9c3156c03ab4a01348f9ade5d6aad95552
      with:
        pr_number: ${{ inputs.initiating-pr-number }}
        message: |
          🔒 User ${{ inputs.username }} does not have permissions to run this workflow
