name: Check Maintainer
description: |
  Fails unless the specified user has the maintain or admin role on the repo.
  Write-role collaborators are denied, so running CI on PR code needs a maintainer.
inputs:
  username:
    description: The GitHub username to check
    required: true
  initiating-pr-number:
    description: The PR number that the check may be associated with, if provided will comment on the PR incase of failures
    required: false
runs:
  using: "composite"
  steps:
    - name: Check if user is a maintainer
      id: assert-is-maintainer
      # For API Docs, See: https://octokit.github.io/rest.js/v21/
      # github --> maps to an octokit instance in the script.
      # No token input: actions/github-script authenticates via its default `github-token`,
      # which is ${{ github.token }} (the workflow's automatic GITHUB_TOKEN).
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        USERNAME: ${{ inputs.username }}
      with:
        # https://docs.github.com/en/rest/collaborators/collaborators?apiVersion=2022-11-28#get-repository-permissions-for-a-user
        script: |
          // Fail closed: authorization succeeds ONLY when the API returns a
          // role_name of "admin" or "maintain". Read `role_name`, not the legacy
          // `permission` field, which reports maintain as "write".
          // Any thrown error (404, 403, rate limit) also denies the run.
          const allowed_roles = ["admin", "maintain"];
          const username = process.env.USERNAME;
          let role_name;
          try {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: username,
            });
            role_name = data.role_name;
          } catch (error) {
            const status = error.status || "unknown";
            throw new Error(
              `${username} is NOT authorized to run this workflow (permission check failed: ${status} ${error.message}).`
            );
          }
          if (!allowed_roles.includes(role_name)) {
            throw new Error(
              `${username} is NOT authorized to run this workflow (role '${role_name}'; requires one of ${allowed_roles.join(", ")}).`
            );
          }
          console.log(`${username} has role '${role_name}'.`);

    - name: Comment workflow permissions
      if: ${{ failure() && steps.assert-is-maintainer.conclusion == 'failure' && inputs.initiating-pr-number != '' }}
      uses: snapchat/gigl/.github/actions/comment-on-pr@main
      with:
        pr_number: ${{ inputs.initiating-pr-number }}
        message: |
          🔒 User ${{ inputs.username }} does not have permissions to run this workflow. Running CI on PR code requires the maintain or admin role.
