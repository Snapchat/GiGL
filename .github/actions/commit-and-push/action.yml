name: "Commit and Push Changes"
description: |
  Commits and pushes changes to the current or specified branch with a customizable commit message.
  Includes changes the workflow has made.
  Only commits changes to files that have been modified or deleted, without adding new files.
  If a new branch is specified, the action will create a new branch and push the changes to it.
  Otherwise, the action will push the changes to the current branch.

  Authentication for the push is supplied inline, scoped to each git invocation, rather than
  relying on credentials persisted in .git/config by actions/checkout. This lets callers run
  (pinned) PR-authored code earlier in the job WITHOUT a push-capable token on disk, then push
  safely from this trusted step.


inputs:
  commit_message:
    description: "Commit message for the changes"
    required: true
    default: "Updated files via GitHub Actions"
  github_token:
    description: "GitHub token to authenticate and push the changes"
    required: true
  to_new_branch_named:
    description: "Name of the branch to push the changes to. If not provided, the changes will be pushed to the current branch."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Commit and push changes
      env:
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TO_NEW_BRANCH_NAMED: ${{ inputs.to_new_branch_named }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Disable git hooks and fsmonitor for EVERY git invocation in this step. PR-authored code
        # that ran earlier in the job (e.g. the image-ref update script) could plant a hook under
        # .git/hooks or set core.hooksPath / core.fsmonitor in .git/config; any of those would
        # execute during `git commit` / `git push` below with GITHUB_TOKEN in the environment.
        # Environment config takes precedence over .git/config, so a planted core.hooksPath
        # cannot re-enable them. (GIT_CONFIG_COUNT/KEY/VALUE are supported since git 2.31.)
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
        export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false

        # Build an inline auth header (same scheme actions/checkout uses) and pass it only on
        # the push commands via `git -c`, so it is not persisted to .git/config. Note this
        # keeps the token off disk but does NOT fully isolate it from PR-authored code that ran
        # earlier in the same job (e.g. a lingering background process could read git's argv);
        # full isolation would require pushing from a separate job.
        AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$AUTH_B64"
        # Prepend an empty extraheader entry to RESET any header persisted in .git/config by a
        # prior actions/checkout. http.extraheader is multi-valued: leaving a persisted value in
        # place alongside ours would send TWO Authorization headers -> GitHub rejects with HTTP
        # 400 ("Duplicate header"). The reset makes this robust for callers that check out with
        # persist-credentials: true (e.g. create_release / nightly).
        GIT_AUTH=(-c "http.https://github.com/.extraheader=" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}")

        if [ "$TO_NEW_BRANCH_NAMED" != "" ]; then
          echo "Creating a new branch, named $TO_NEW_BRANCH_NAMED, and pushing the changes to it"
          git checkout -b "$TO_NEW_BRANCH_NAMED"
          git "${GIT_AUTH[@]}" push --set-upstream origin "$TO_NEW_BRANCH_NAMED"
        fi

        # Stages changes (modifications and deletions) to tracked files, but ignores new untracked files.
        # This is to ensure that workflows are not staging any files that might have been created
        # temporarily and have not been cleaned up.
        git add --update

        # If no changes, exit gracefully. If not done, git commit will fail.
        if git diff --cached --exit-code; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"
        git "${GIT_AUTH[@]}" push
      shell: bash
