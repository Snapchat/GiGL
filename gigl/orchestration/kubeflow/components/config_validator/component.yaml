name: KFP Validation Check
description: KFP Validation Check
inputs:
- {name: job_name, type: String, description: 'Unique name to identify the job'}
- {name: source_task_config_uri, type: String, description: 'User-supplied template or frozen GBML config URI to compose'}
- {name: start_at, type: String, description: 'Start component'}
- {name: source_resource_config_uri, type: String, description: 'User-supplied resource config URI to compose'}
- {name: stop_after, type: String, description: 'Stop component'}
- {name: cpu_docker_uri, type: String, description: "Uri to dockerized source code compiled for cpu at runtime"}
- {name: cuda_docker_uri, type: String, description: "Uri to dockerized source code compiled for gpu at runtime"}
outputs:
- {name: composed_task_config_snapshot_uri, type: String, description: 'Composed task config snapshot URI for downstream components'}
- {name: composed_resource_config_snapshot_uri, type: String, description: 'Composed resource config snapshot URI for downstream components'}
- {name: should_use_glt_backend, type: Boolean, description: 'Whether to use the GLT backend'}

implementation:
  container:
    image: us-central1-docker.pkg.dev/external-snap-ci-github-gigl/gigl-base-images/src-cpu:latest # Dummy value, always overwritten by arguments passed to gnn.py
    command: [
      python, -m, gigl.src.validation_check.config_validator,
      --job_name, {inputValue: job_name},
      --source_task_config_uri, {inputValue: source_task_config_uri},
      --start_at, {inputValue: start_at},
      --source_resource_config_uri, {inputValue: source_resource_config_uri},
      --stop_after, {inputValue: stop_after},
      --cpu_docker_uri, {inputValue: cpu_docker_uri},
      --cuda_docker_uri, {inputValue: cuda_docker_uri},
      --output_file_path_composed_task_config_snapshot_uri, {outputPath: composed_task_config_snapshot_uri},
      --output_file_path_composed_resource_config_snapshot_uri, {outputPath: composed_resource_config_snapshot_uri},
      --output_file_path_should_use_glt_backend, {outputPath: should_use_glt_backend}
    ]
