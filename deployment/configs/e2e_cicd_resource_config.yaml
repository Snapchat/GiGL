# GiglResourceConfig for our e2e intergration tests.
# The fragments fill shared_resource_config and preprocessor_config.
# _self_ merges this file last, so its values take precedence.
defaults:
  - e2e/shared@shared_resource_config
  - e2e/preprocessor@preprocessor_config
  - _self_

subgraph_sampler_config:
  machine_type: "n2-highmem-16"
  num_local_ssds: 2
  num_replicas: 4
split_generator_config:
  machine_type: n2-standard-16
  num_local_ssds: 2
  num_replicas: 4
# CPU training on E2 for the legacy (SGS) pipelines: chosen for availability in
# us-central1 CI, and to leave T4 supply to the GLT e2e tests that need CUDA coverage.
# In practice, train on a GPU shape (for example n1-highmem-8 + NVIDIA_TESLA_T4).
trainer_config:
  vertex_ai_trainer_config:
    machine_type: "e2-highmem-8"
    gpu_type: ACCELERATOR_TYPE_UNSPECIFIED
    gpu_limit: 0
    num_replicas: 2
inferencer_config:
  num_workers: 1
  max_num_workers: 256
  machine_type: "e2-standard-8"
